# 매주 식약처 Open API를 호출해 data/recipe-allergens.json 을 새로 만들고 저장소에 저장합니다.
name: Update recipe allergens

on:
  schedule:
    # 매주 월요일 오전 3시(한국 시간) = 일요일 18:00 UTC
    - cron: "0 18 * * 0"
  workflow_dispatch: # Actions 탭에서 "Run workflow" 버튼으로 수동 실행도 가능

permissions:
  contents: write # 갱신된 JSON을 저장소에 커밋하기 위해 필요

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 레시피 수집 + 알레르기 판정
        env:
          FOODSAFETY_API_KEY: ${{ secrets.FOODSAFETY_API_KEY }}
        run: python scripts/build_recipes.py

      - name: 바뀐 내용이 있으면 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/recipe-allergens.json
          if git diff --cached --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "chore: 레시피 알레르기 데이터 자동 갱신"
            git push
          fi
